<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS Log</title>
<style>
:root{--bg:#f3f5f1;--surface:#fff;--ink:#16221b;--muted:#5d6b62;--line:#d9dfd8;--accent:#1f6f4a;--accent-ink:#fff;--warn:#a23b2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--surface:#18211b;--ink:#e8efe9;--muted:#93a198;--line:#2a372e;--accent:#5fc58f;--accent-ink:#0b1a11;--warn:#ef8c7a}}
:root[data-theme="dark"]{--bg:#101712;--surface:#18211b;--ink:#e8efe9;--muted:#93a198;--line:#2a372e;--accent:#5fc58f;--accent-ink:#0b1a11;--warn:#ef8c7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.1rem;margin:4px 0 14px;font-weight:650}
.fix{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.coords{font:600 1.5rem/1.25 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.meta{color:var(--muted);font-size:.9rem;margin-top:6px}
.status{margin-top:8px;font-size:.9rem;color:var(--muted)}
.status.err{color:var(--warn)}
input[type=text]{width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px;margin-top:12px}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;flex:1}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650;padding:16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5}
h2{font-size:1rem;margin:22px 0 8px}
ul{list-style:none;margin:0;padding:0}
li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
li .c{font:600 .95rem ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
li .n{font-weight:600;margin-bottom:2px}
li .t{color:var(--muted);font-size:.82rem;margin-top:2px}
li .a{display:flex;gap:14px;margin-top:6px}
li .a button{flex:none;padding:4px 0;border:0;background:none;color:var(--accent);font-size:.9rem}
li .a button.del{color:var(--warn)}
.empty{color:var(--muted);padding:12px 0}
textarea{width:100%;height:140px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:12px ui-monospace,Menlo,monospace;padding:10px;display:none}
</style>
</head>
<body>
<main>
<h1>GPS log</h1>

<section class="fix" aria-live="polite">
  <div class="coords" id="coords">Waiting for GPS…</div>
  <div class="meta" id="meta"></div>
  <div class="status" id="status">Allow location access when your browser asks.</div>
  <input type="text" id="note" placeholder="Label (optional)" autocomplete="off">
  <div class="row"><button class="primary" id="save" disabled>Save location</button></div>
</section>

<h2>Saved locations <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
<ul id="list"></ul>

<div class="row">
  <button id="copy">Copy as CSV</button>
  <button id="clear">Clear all</button>
</div>
<textarea id="out" readonly aria-label="CSV export"></textarea>
</main>

<script>
(function(){
  var KEY="gpslog:v1", entries=[], fix=null, watchId=null;
  var $=function(id){return document.getElementById(id)};

  function load(){try{var r=localStorage.getItem(KEY);entries=r?JSON.parse(r):[]}catch(e){entries=[]}}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){setStatus("Could not save to this browser's storage.",true)}}
  function setStatus(t,err){var s=$("status");s.textContent=t;s.className="status"+(err?" err":"")}
  function fmt(n){return n.toFixed(6)}
  function mapsUrl(e){return "https://www.google.com/maps?q="+e.lat+","+e.lon}

  function start(){
    if(!navigator.geolocation){setStatus("This browser has no location support.",true);return}
    watchId=navigator.geolocation.watchPosition(function(p){
      fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,alt:p.coords.altitude};
      $("coords").textContent=fmt(fix.lat)+", "+fmt(fix.lon);
      $("meta").textContent="Accuracy ±"+Math.round(fix.acc)+" m"+(fix.alt!=null?" · Altitude "+Math.round(fix.alt)+" m":"");
      setStatus("Live position. Tap Save to log it.");
      $("save").disabled=false;
    },function(err){
      var m={1:"Location is blocked. Allow it in your browser's site settings, then reload.",2:"Position unavailable. Try moving to open sky.",3:"Timed out getting a fix. Still trying…"}[err.code]||"Location error.";
      setStatus(m,true);
    },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  }

  function render(){
    var ul=$("list");ul.innerHTML="";
    $("count").textContent=entries.length?"("+entries.length+")":"";
    if(!entries.length){var d=document.createElement("div");d.className="empty";d.textContent="Nothing saved yet. Tap Save location to log your first point.";ul.appendChild(d);return}
    entries.slice().reverse().forEach(function(e){
      var li=document.createElement("li");
      if(e.note){var n=document.createElement("div");n.className="n";n.textContent=e.note;li.appendChild(n)}
      var c=document.createElement("div");c.className="c";c.textContent=fmt(e.lat)+", "+fmt(e.lon);li.appendChild(c);
      var t=document.createElement("div");t.className="t";t.textContent=new Date(e.time).toLocaleString()+" · ±"+Math.round(e.acc)+" m";li.appendChild(t);
      var a=document.createElement("div");a.className="a";
      var m=document.createElement("button");m.textContent="Open in Maps";m.onclick=function(){window.open(mapsUrl(e),"_blank")};
      var cp=document.createElement("button");cp.textContent="Copy";cp.onclick=function(){copyText(e.lat+", "+e.lon)};
      var x=document.createElement("button");x.className="del";x.textContent="Delete";x.onclick=function(){entries=entries.filter(function(i){return i.id!==e.id});persist();render()};
      a.appendChild(m);a.appendChild(cp);a.appendChild(x);li.appendChild(a);ul.appendChild(li);
    });
  }

  function copyText(txt){
    var ta=$("out");
    function fallback(){ta.style.display="block";ta.value=txt;ta.focus();ta.select();setStatus("Select the text above and copy it.")}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){setStatus("Copied.")},fallback);
    }else fallback();
  }

  function csv(){
    var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};
    return ["time,latitude,longitude,accuracy_m,altitude_m,label"].concat(entries.map(function(e){
      return [e.time,e.lat,e.lon,Math.round(e.acc),e.alt==null?"":Math.round(e.alt),q(e.note||"")].join(",")
    })).join("\n");
  }

  $("save").onclick=function(){
    if(!fix)return;
    entries.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),time:new Date().toISOString(),lat:fix.lat,lon:fix.lon,acc:fix.acc,alt:fix.alt,note:$("note").value.trim()});
    $("note").value="";persist();render();setStatus("Saved.");
    if(navigator.vibrate)navigator.vibrate(40);
  };
  $("copy").onclick=function(){if(!entries.length){setStatus("Nothing to copy yet.",true);return}copyText(csv())};
  $("clear").onclick=function(){if(entries.length&&confirm("Delete all "+entries.length+" saved locations?")){entries=[];persist();render()}};

  load();render();start();
})();
</script>
</body>
</html>
